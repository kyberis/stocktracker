[env:lilygo-t4-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash / PSRAM matching the actual chip in this T4-S3 unit.
; esptool detects: ESP32-S3 (QFN56) v0.2, 8 MB flash, 8 MB PSRAM (AP_3v3).
; Using 16MB partitions on this 8MB chip caused a bootloader reset loop.
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = spiffs

; USB-CDC for serial output over USB-C
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLILYGO_T4_S3

; Upload via USB
upload_speed = 460800
monitor_speed = 115200
; Prevent USB-Serial adapters from toggling DTR/RTS (avoids accidental reset loops while debugging)
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

; Built-in JTAG debugging (no external adapter needed)
debug_tool = esp-builtin

; LilyGo AMOLED library (includes display + touch drivers)
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git
    bblanchon/ArduinoJson@^7

; Exclude simulator-only sources, hello diagnostic, and standalone demo mains from default firmware build
build_src_filter = +<*> -<sim_*.cpp> -<hello.cpp> -<display_test_main.cpp> -<display_cycle_main.cpp> -<text_demo_main.cpp> -<bare_serial_main.cpp>


; ── Minimal hello-world diagnostic (validates flash + display + LVGL) ─
; Usage:  pio run -e hello --target upload && pio device monitor
[env:hello]
extends = env:lilygo-t4-s3
build_flags =
    ${env:lilygo-t4-s3.build_flags}
    -DHELLO_WORLD=1
build_src_filter = -<*> +<hello.cpp>


; ── Minimal solid-colour panel test (no LVGL/WiFi) ———————————————————
; pio run -e display-test --target upload  ; magenta fill to verify RM690B0 wiring
[env:display-test]
extends = env:lilygo-t4-s3
build_src_filter = -<*> +<display_test_main.cpp>


; ── RGB cycle (no LVGL) — isolates hardware vs LVGL ————————————————————
[env:display-cycle]
extends = env:lilygo-t4-s3
build_src_filter = -<*> +<display_cycle_main.cpp>


; ── One-screen centred text (LVGL) ————————————————————————————————
[env:text-demo]
extends = env:lilygo-t4-s3
build_src_filter = -<*> +<text_demo_main.cpp>


; ── No LilyGo/LVGL — heartbeat on USB only (isolate bootloops / CDC) ──
[env:bare-serial]
extends = env:lilygo-t4-s3
build_src_filter = -<*> +<bare_serial_main.cpp>


; Same as bare-serial but no BOARD_HAS_PSRAM — isolates crashes during ESP-IDF /
; Arduino SPIRAM bring-up on some USB-JTAG/USB-CDC combos.
[env:bare-serial-nopsram]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 460800
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
build_src_filter = -<*> +<bare_serial_main.cpp>


; ── Desktop SDL2 simulator (no device needed) ────────────────────────
; Usage:  pio run -e simulator && .pio/build/simulator/program
[env:simulator]
platform = native
build_flags =
    -DSIMULATOR=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I simulator
    -I/opt/homebrew/include/SDL2
    -D_THREAD_SAFE
    -L/opt/homebrew/lib
    -lSDL2
    -lcurl
lib_deps =
    lvgl/lvgl@~8.4.0
    bblanchon/ArduinoJson@^7
lib_archive = false

; Only compile simulator + shared sources (skip device mains + standalone demos)
build_src_filter = +<*> -<main.cpp> -<display_test_main.cpp> -<display_cycle_main.cpp> -<text_demo_main.cpp> -<bare_serial_main.cpp>
