[env:lilygo-t4-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Flash / PSRAM matching the T4-S3 hardware
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; USB-CDC for serial output over USB-C
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLILYGO_T4_S3

; Upload via USB
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Built-in JTAG debugging (no external adapter needed)
debug_tool = esp-builtin

; LilyGo AMOLED library (includes display + touch drivers)
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git

; Exclude simulator-only sources from device build
build_src_filter = +<*> -<sim_*.cpp>


; ── Desktop SDL2 simulator (no device needed) ────────────────────────
; Usage:  pio run -e simulator && .pio/build/simulator/program
[env:simulator]
platform = native
build_flags =
    -DSIMULATOR=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I simulator
    -I/opt/homebrew/include/SDL2
    -D_THREAD_SAFE
    -L/opt/homebrew/lib
    -lSDL2
lib_deps =
    lvgl/lvgl@~8.4.0
lib_archive = false

; Only compile simulator + shared sources (skip device main.cpp)
build_src_filter = +<*> -<main.cpp>
