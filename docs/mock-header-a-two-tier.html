<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock A — Two-tier header (Yahoo-style search row)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #0f172a;
      --muted: #64748b;
      --emerald: #059669;
      --emerald-soft: #ecfdf5;
      --ticker-bg: #0f172a;
      --ticker-fg: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Instrument Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .ticker {
      background: var(--ticker-bg);
      color: var(--ticker-fg);
      font-size: 11px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      white-space: nowrap;
      font-family: "JetBrains Mono", monospace;
    }
    .ticker span.up { color: #34d399; }
    .ticker span.down { color: #f87171; }
    .badge-mock {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      margin-left: 6px;
    }
    /* Row 1: identity + nav + utilities */
    .row1 {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .left-cluster {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.03em;
    }
    .portfolio-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
    }
    .nav-pills {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-pills a {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
    }
    .nav-pills a:hover { background: #f1f5f9; color: var(--text); }
    .nav-pills a.active {
      background: var(--emerald-soft);
      color: var(--emerald);
    }
    .more-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .more-btn:hover { background: #f1f5f9; }
    .utilities {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .icon-btn:hover { background: #f1f5f9; }
    .lang-pill {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    /* Row 2: dedicated search — full width, no crowding */
    .row2 {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 20px 16px;
      background: var(--surface);
    }
    .search-wrap {
      display: flex;
      align-items: stretch;
      max-width: 720px;
      margin: 0 auto;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }
    .search-wrap:focus-within {
      border-color: rgba(5, 150, 105, 0.45);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
    }
    .search-wrap svg {
      align-self: center;
      margin-left: 16px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .search-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 14px 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      min-width: 0;
    }
    .search-wrap button {
      padding: 0 22px;
      border: none;
      background: var(--emerald);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .search-wrap button:hover { background: #047857; }
    .hint {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .subbar-mock {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      background: #f8fafc;
      font-size: 12px;
      color: var(--muted);
    }
    .subbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-primary {
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      background: var(--emerald);
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .label-a {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: var(--text);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
    }
  </style>
</head>
<body>
  <div class="ticker">
    <span>NYSE</span><span class="up">+0.2%</span><span class="ticker-div">|</span>
    <span>NASDAQ</span><span class="down">+0.1%</span><span class="ticker-div">|</span>
    <span>BTC</span><span>$72,095</span><span class="up">+1.2%</span>
  </div>

  <div class="row1">
    <div class="left-cluster">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0f172a"/><g transform="translate(16,16) rotate(45)"><ellipse cx="0" cy="-4.8" rx="4" ry="5.8" fill="#10b981"/></g></svg>
        trefolio
      </div>
      <div class="portfolio-pill">
        My Portfolio
        <span class="badge-mock">EUR</span>
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <nav class="nav-pills" aria-label="Primary">
        <a href="#" class="active">Home</a>
        <a href="#">Evolution</a>
        <a href="#">Import</a>
        <a href="#">Tools</a>
        <button type="button" class="more-btn">More <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      </nav>
    </div>
    <div class="utilities">
      <button type="button" class="icon-btn" aria-label="Notifications">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5"/></svg>
      </button>
      <button type="button" class="icon-btn" aria-label="Privacy"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg></button>
      <button type="button" class="icon-btn" aria-label="Theme"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></button>
      <span class="lang-pill">EN ▾</span>
      <div class="user-pill"><span class="avatar">A</span> Admin ▾</div>
    </div>
  </div>

  <div class="row2">
    <div class="search-wrap" role="search">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      <input type="search" placeholder="Search tickers, ETFs, crypto, company names…" />
      <button type="button">Search</button>
    </div>
    <p class="hint">Mock A — Search sits on its own row (centered, max 720px). Nav + “More” stay above; no crowding.</p>
  </div>

  <div class="subbar-mock">
    <span>● Quotes as of 23:00</span>
    <div class="subbar-actions">
      <button type="button" class="icon-btn" aria-label="Settings">⚙</button>
      <button type="button" class="btn-primary">+ Add ▾</button>
    </div>
  </div>

  <div class="label-a">Mock A — Two-tier</div>
</body>
</html>
