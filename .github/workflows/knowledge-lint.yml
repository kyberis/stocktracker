name: Knowledge base lint

on:
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - "src/**"
      - ".cursor/skills/**"
      - ".cursor/rules/**"
      - "scripts/gen-knowledge-generated.ts"
      - "scripts/lint-knowledge.ts"
      - ".github/workflows/knowledge-lint.yml"
  pull_request:
    paths:
      - "knowledge/**"
      - "src/**"
      - ".cursor/skills/**"
      - ".cursor/rules/**"
      - "scripts/gen-knowledge-generated.ts"
      - "scripts/lint-knowledge.ts"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Lint knowledge base
        run: npm run knowledge:lint
      - name: Regenerate knowledge/generated/ and check for drift
        run: |
          npm run knowledge:gen
          if ! git diff --quiet knowledge/generated; then
            echo "::error::knowledge/generated/ is out of date. Run 'npm run knowledge:gen' and commit."
            git diff knowledge/generated
            exit 1
          fi
