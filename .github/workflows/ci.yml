name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: http://localhost:3000
          TURSO_DATABASE_URL: libsql://fake.turso.io
          TURSO_AUTH_TOKEN: fake

  e2e-aid:
    name: E2E — AID smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build (E2E webServer uses npm start only in CI)
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: http://localhost:3000
          TURSO_DATABASE_URL: libsql://fake.turso.io
          TURSO_AUTH_TOKEN: fake

      - name: AID dashboard E2E
        run: npm run test:e2e -- e2e/aid-dashboard.spec.ts
        env:
          E2E: "1"
          NEXTAUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: http://localhost:3000
          TURSO_DATABASE_URL: libsql://fake.turso.io
          TURSO_AUTH_TOKEN: fake
