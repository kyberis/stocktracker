name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Build
        run: npm run build
        env:
          # Build-time env stubs — real values come from Vercel env vars in production.
          # Only set variables that are strictly needed for `next build` to succeed.
          NEXTAUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: http://localhost:3000
          TURSO_DATABASE_URL: libsql://fake.turso.io
          TURSO_AUTH_TOKEN: fake
